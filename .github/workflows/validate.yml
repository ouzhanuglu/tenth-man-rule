name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workflows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the workflow files
        run: |
          set -euo pipefail
          # Pinned release, downloaded directly with its published checksum verified, so the
          # job does not depend on a marketplace action's release cadence. No untrusted input
          # reaches this script: the only values are the constants below.
          VERSION=1.7.7
          BASE="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          ASSET="actionlint_${VERSION}_linux_amd64.tar.gz"
          curl -sSL -o "$ASSET" "${BASE}/${ASSET}"
          curl -sSL -o checksums.txt "${BASE}/actionlint_${VERSION}_checksums.txt"
          # checksums.txt lists the asset by its published name, so verify by that name.
          grep " ${ASSET}\$" checksums.txt | sha256sum -c -
          tar -xzf "$ASSET" actionlint
          # Pass the files explicitly: actionlint otherwise needs to discover a git project,
          # which makes the step fail for a reason unrelated to workflow correctness.
          ./actionlint -color .github/workflows/*.yml

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate frontmatter and build the archives
        run: python3 .github/scripts/package_skill.py . dist

      - name: Assert the package holds only skill content
        run: |
          python3 - <<'PY'
          import glob, zipfile

          skill_pkg = glob.glob("dist/*.skill")[0]
          evals_pkg = glob.glob("dist/*-evals.zip")
          names = zipfile.ZipFile(skill_pkg).namelist()

          assert names, "skill package is empty"
          assert all(n.startswith("tenth-man-rule/") for n in names), names
          assert not any(n.startswith(("tenth-man-rule/evals/", "tenth-man-rule/review/")) for n in names), names
          assert not any(n.endswith((".pyc", "INSTALL.md")) for n in names), names
          print("skill package:", names)

          if evals_pkg:
              ev = zipfile.ZipFile(evals_pkg[0]).namelist()
              assert "INSTALL.md" in ev, ev
              assert "evals/evals.json" in ev, ev
              assert "review/review-cases.json" in ev, ev
              print("bundle:", len(ev), "files, INSTALL.md at root, evals+review trees")
          PY

      - name: Summarise
        run: ls -l dist
