# infra/nginx/admin.conf  (excerpt, deployed at the edge since 2024-03)

location /admin/ {
    allow 10.0.0.0/8;
    allow 172.20.1.0/24;   # VPN egress NAT pool
    deny  all;

    include fastcgi_params;
    fastcgi_pass php-fpm;
}

# deployed in front of all app hosts by the standard release bundle;
# verified by `nginx -T` on the edge during each deploy.
